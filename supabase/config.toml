# Só o que o deploy das Edge Functions precisa. O projeto é remoto (não usamos
# `supabase start`), então não há mais nada aqui de propósito.
project_id = "treino-pp"

# Quem chama o webhook é o Mercado Pago, que não manda JWT do Supabase. Fixar aqui
# evita que um `supabase functions deploy` sem --no-verify-jwt reative a exigência.
[functions.mp-webhook]
verify_jwt = false

# Página pública: o aluno confirma o consentimento pelo link do e-mail, sem login.
[functions.confirmar-consentimento-saude]
verify_jwt = false

# Página pública /treino/:token: o aluno (sem conta) vê e registra o treino pelo link do WhatsApp.
[functions.treino-publico]
verify_jwt = false

# Chamadas pelo pg_cron (sem JWT do Supabase); cada uma confere o segredo CRON_SECRET no header x-cron-secret.
[functions.daily-briefing]
verify_jwt = false

[functions.avisos-diarios]
verify_jwt = false

[functions.weekly-summary]
verify_jwt = false

[functions.avisos-financeiros]
verify_jwt = false

[functions.aviso-treino-concluido]
verify_jwt = false
