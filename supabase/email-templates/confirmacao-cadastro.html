<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirme seu cadastro</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:'Open Sans',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;max-width:600px;width:100%;">
          <!-- Header -->
          <tr>
            <td style="background:#0F2537;padding:32px;text-align:center;">
              <img src="https://treino.personalperto.com.br/brand/logo-email.png" alt="Personal Perto" height="48" style="display:block;margin:0 auto;">
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:40px 32px;">
              <h1 style="font-family:Montserrat,Arial,sans-serif;color:#0F2537;font-size:24px;margin:0 0 16px;">Confirme seu cadastro</h1>
              <p style="color:#444;font-size:16px;line-height:1.6;margin:0 0 24px;">Olá! Clique no botão abaixo para confirmar seu e-mail e ativar sua conta no Personal Perto.</p>
              <table cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                <tr>
                  <td style="background:#4CAF50;border-radius:6px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;color:#ffffff;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:16px;text-decoration:none;">Confirmar e-mail</a>
                  </td>
                </tr>
              </table>
              <p style="color:#888;font-size:13px;line-height:1.6;margin:0;">Se você não criou uma conta, ignore este e-mail. O link expira em 24 horas.</p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f4f6f8;padding:24px 32px;text-align:center;">
              <p style="color:#aaa;font-size:12px;margin:0;">© 2026 Personal Perto · Rio de Janeiro, RJ</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
