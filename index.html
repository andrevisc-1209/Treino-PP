<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#367c39" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/Treino-PP/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Treino-PP/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/Treino-PP/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />
    <title>%APP_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Splash: fica visível até o React montar (main.tsx remove), pra não
         piscar tela branca ao abrir o app instalado. -->
    <div
      id="splash"
      style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #367c39"
    >
      <img src="/src/assets/brand/icon-mark.png" alt="Personal Perto" style="height: 96px; width: auto" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
